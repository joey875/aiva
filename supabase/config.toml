# Aiva — Supabase project settings pushed with `npx supabase config push`.
# Only auth is customized; everything else uses Supabase defaults.
project_id = "jzggvasbaqdycduyyvje"

[auth]
enabled = true
# __SITE_URL__ is replaced with the production host during deploy (prompt 003)
site_url = "https://__SITE_URL__"
additional_redirect_urls = ["https://__SITE_URL__/auth/confirm", "https://__SITE_URL__/auth/callback", "http://localhost:3000/auth/confirm", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Signups stay technically enabled so the owner can self-provision on first sign-in.
# The app only sends links to invited people, and anyone without a profile is signed out.
enable_signup = true

[auth.rate_limit]
email_sent = 60

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_expiry = 3600

# Send auth email (sign-in links, invites) through Resend from golocaltv.com
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "aiva@golocaltv.com"
sender_name = "Aiva"
